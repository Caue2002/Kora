<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sacola" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="brilhoForte" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fundo arredondado com gradiente azul tech -->
  <rect width="64" height="64" rx="18" fill="url(#g)"/>
  <ellipse cx="32" cy="12" rx="24" ry="9" fill="#ffffff" opacity="0.16"/>

  <!-- sacola termica de entrega -->
  <g>
    <path d="M23 31v-1.5a9 9 0 0 1 18 0V31" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="17" y="31" width="30" height="23" rx="5" fill="url(#sacola)"/>
    <path d="M17 37.5h30" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <circle cx="32" cy="45" r="3" fill="#2563EB"/>
  </g>

  <!-- badge de verificacao -->
  <circle cx="47" cy="46" r="9.5" fill="#ffffff"/>
  <path d="M42.5 46l3 3 6.5-7.5" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- brilhos de IA: estrelas de 4 pontas -->
  <g fill="#FFD166" filter="url(#brilhoForte)">
    <path d="M49 9l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2z"/>
  </g>
  <g fill="#ffffff" filter="url(#brilho)">
    <path d="M11 40l1.4 3.2 3.2 1.4-3.2 1.4L11 49.2l-1.4-3.2-3.2-1.4 3.2-1.4z"/>
    <path d="M55 30l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z" opacity="0.9"/>
  </g>
</svg>
