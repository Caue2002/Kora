name: Evals do Nori

# Quality gate de qualidade do agente: golden dataset (rubricas regex) +
# LLM-as-judge rodam contra a API real a cada push/PR. Lentos (~5-10 min)
# por isso ficam em workflow separado do testes.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias da API
        run: npm ci

      - name: Configurar .env a partir dos secrets
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"
          } > .env

      - name: Rodar evals (golden dataset + LLM-as-judge)
        # Arquivos rodam em sequencia: em paralelo dobravam a carga na API
        # free-tier e causavam 503/429 em cascata. Cota satura por janelas:
        # ate 3 tentativas com 4min de espera absorvem os flakes
        run: |
          for tentativa in 1 2 3; do
            npx vitest run tests/evals.test.ts && npx vitest run tests/evals-juiz.test.ts && exit 0
            echo "Tentativa $tentativa falhou (provavel saturacao de cota)"
            [ "$tentativa" -lt 3 ] && sleep 240
          done
          exit 1
